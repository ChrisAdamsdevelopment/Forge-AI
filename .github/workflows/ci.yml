name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ruff 0.17 introduced new diagnostics not yet addressed in main.
      # Pin the 0.15.14 baseline, then upgrade in a separate lint migration.
      - run: pip install ruff==0.15.14 pytest pytest-asyncio
      - run: pip install -r implementation/backend/requirements.txt
      - run: ruff check implementation/backend/forge/
      - run: ruff format --check implementation/backend/forge/
      - run: pytest implementation/backend/tests
